<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .box { fill: #f0f4ff; stroke: #4f5d9a; stroke-width: 2; }
    .module { fill: #ffffff; stroke: #2d3758; stroke-width: 2; }
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #1c1f33; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1c1f33; }
    .signal { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
    .arrow { stroke: #1f4068; stroke-width: 2; marker-end: url(#arrowhead); }
    .connector { stroke: #1f4068; stroke-width: 2; stroke-dasharray: 4 2; }
    .block { fill: #e5edff; stroke: #3e4f8a; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4068" />
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="380" rx="18" class="box" />
  <text x="40" y="50" class="title">RTL Schematic Diagram</text>

  <rect x="100" y="100" width="220" height="180" rx="14" class="module" />
  <text x="110" y="125" class="label">alu_4bit</text>
  <text x="110" y="150" class="signal">a[3:0]</text>
  <text x="110" y="170" class="signal">b[3:0]</text>
  <text x="110" y="190" class="signal">op[1:0]</text>
  <text x="110" y="215" class="signal">out[3:0]</text>
  <text x="110" y="235" class="signal">zero, carry, overflow</text>

  <rect x="340" y="100" width="220" height="180" rx="14" class="module" />
  <text x="350" y="125" class="label">mux4to1</text>
  <text x="350" y="150" class="signal">sel[1:0]</text>
  <text x="350" y="170" class="signal">in0[3:0]</text>
  <text x="350" y="190" class="signal">in1[3:0]</text>
  <text x="350" y="210" class="signal">in2[3:0]</text>
  <text x="350" y="230" class="signal">in3[3:0]</text>
  <text x="350" y="255" class="signal">out[3:0]</text>

  <rect x="580" y="100" width="220" height="140" rx="14" class="module" />
  <text x="590" y="125" class="label">counter3</text>
  <text x="590" y="150" class="signal">clk</text>
  <text x="590" y="170" class="signal">rst</text>
  <text x="590" y="190" class="signal">en</text>
  <text x="590" y="215" class="signal">count[2:0]</text>

  <rect x="100" y="300" width="700" height="90" rx="14" class="block" />
  <text x="110" y="325" class="label">clb_design</text>
  <text x="110" y="350" class="signal">instantiates: alu_4bit, mux4to1, counter3</text>
  <text x="110" y="370" class="signal">Top-level RTL module connecting the three submodules.</text>

  <line x1="220" y1="280" x2="220" y2="300" class="arrow" />
  <line x1="450" y1="280" x2="450" y2="300" class="arrow" />
  <line x1="690" y1="280" x2="690" y2="300" class="arrow" />

  <line x1="160" y1="100" x2="160" y2="80" class="connector" marker-end="url(#arrowhead)" />
  <text x="80" y="77" class="signal">a[3:0], b[3:0], op[1:0]</text>
  <line x1="430" y1="100" x2="430" y2="80" class="connector" marker-end="url(#arrowhead)" />
  <text x="390" y="77" class="signal">sel and inputs</text>
  <line x1="650" y1="100" x2="650" y2="80" class="connector" marker-end="url(#arrowhead)" />
  <text x="620" y="77" class="signal">clk, rst, en</text>

  <line x1="230" y1="190" x2="320" y2="190" class="arrow" />
  <text x="260" y="180" class="signal">data</text>
  <line x1="560" y1="190" x2="570" y2="190" class="arrow" />
  <text x="520" y="180" class="signal">count</text>
</svg>
